name: Starter static checks
on:
  push:
  pull_request:
jobs:
  react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: for script in scripts/*.sh; do bash -n "$script"; done
      - name: Check Python syntax
        run: python -m compileall -q apps scripts tests
      - name: Check Desk and browser-test JavaScript syntax
        run: for script in scripts/*.cjs apps/plus_point/plus_point/public/js/*.js apps/plus_point/plus_point/plus_point/report/*/*.js apps/plus_point/plus_point/plus_point/doctype/*/*.js; do node --check "$script"; done
      - name: Run offline unit checks
        run: python -m unittest discover -s tests -v
      - name: Contractor finance rules
        env:
          PYTHONPATH: apps/plus_point
        run: |
          python -m unittest discover -s apps/plus_point/plus_point/tests -p test_finance.py -v
          python -m unittest discover -s apps/plus_point/plus_point/tests -p test_register.py -v
